<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Guestbook</title>
<style>
  :root {
    color-scheme: light dark;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 640px;
    margin: 2rem auto;
    padding: 0 1rem;
    line-height: 1.5;
  }
  h1 {
    margin-bottom: 0.25rem;
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    margin: 1.5rem 0;
    padding: 1rem;
    border: 1px solid #8884;
    border-radius: 8px;
  }
  label {
    font-weight: 600;
    font-size: 0.9rem;
  }
  input, textarea {
    font: inherit;
    padding: 0.5rem;
    border: 1px solid #8886;
    border-radius: 6px;
    resize: vertical;
  }
  button {
    align-self: flex-start;
    font: inherit;
    padding: 0.5rem 1.25rem;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: white;
    cursor: pointer;
  }
  button:hover {
    background: #1d4ed8;
  }
  #error {
    color: #b91c1c;
    font-size: 0.9rem;
    min-height: 1.2em;
  }
  #entries {
    list-style: none;
    padding: 0;
  }
  #entries li {
    padding: 0.75rem 0;
    border-bottom: 1px solid #8883;
  }
  .entry-name {
    font-weight: 600;
  }
  .entry-time {
    font-size: 0.8rem;
    color: #888;
    float: right;
  }
  .entry-message {
    margin-top: 0.25rem;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #empty {
    color: #888;
    font-style: italic;
  }
</style>
</head>
<body>
  <h1>Guestbook</h1>
  <p>Leave a message below — everyone can see it.</p>

  <form id="guestbook-form">
    <div>
      <label for="name">Name</label><br />
      <input type="text" id="name" name="name" maxlength="80" required />
    </div>
    <div>
      <label for="message">Message</label><br />
      <textarea id="message" name="message" maxlength="500" rows="4" required></textarea>
    </div>
    <div id="error" role="alert"></div>
    <button type="submit">Sign Guestbook</button>
  </form>

  <h2>Entries</h2>
  <p id="empty" hidden>No entries yet. Be the first to sign!</p>
  <ul id="entries"></ul>

  <script>
    const form = document.getElementById('guestbook-form');
    const errorEl = document.getElementById('error');
    const entriesEl = document.getElementById('entries');
    const emptyEl = document.getElementById('empty');

    function formatTimestamp(isoString) {
      const date = new Date(isoString);
      if (Number.isNaN(date.getTime())) return isoString;
      return date.toLocaleString();
    }

    function renderEntries(entries) {
      entriesEl.innerHTML = '';
      emptyEl.hidden = entries.length > 0;

      for (const entry of entries) {
        const li = document.createElement('li');

        const timeSpan = document.createElement('span');
        timeSpan.className = 'entry-time';
        timeSpan.textContent = formatTimestamp(entry.created_at);

        const nameSpan = document.createElement('span');
        nameSpan.className = 'entry-name';
        nameSpan.textContent = entry.name;

        const messageDiv = document.createElement('div');
        messageDiv.className = 'entry-message';
        messageDiv.textContent = entry.message;

        li.appendChild(timeSpan);
        li.appendChild(nameSpan);
        li.appendChild(messageDiv);
        entriesEl.appendChild(li);
      }
    }

    async function loadEntries() {
      const res = await fetch('/api/entries');
      const entries = await res.json();
      renderEntries(entries);
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorEl.textContent = '';

      const name = form.name.value.trim();
      const message = form.message.value.trim();

      if (!name || !message) {
        errorEl.textContent = 'Name and message are both required.';
        return;
      }

      try {
        const res = await fetch('/api/entries', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, message }),
        });

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          errorEl.textContent = data.error || 'Something went wrong. Please try again.';
          return;
        }

        form.reset();
        await loadEntries();
      } catch (err) {
        errorEl.textContent = 'Could not reach the server. Please try again.';
      }
    });

    loadEntries();
  </script>
</body>
</html>
