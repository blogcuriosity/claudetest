name: Build Namaste Mega Mart Android app
on:
  push:
    branches: [namaste-twa-build]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        id: build
        run: |
          set -o pipefail
          mkdir -p out
          {
            set -ex
            npm install --no-audit --no-fund @bubblewrap/core
            node generate.js
            cd android
            chmod +x gradlew
            ./gradlew --no-daemon assembleRelease bundleRelease
            cd ..
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            echo "build-tools: $BT"
            UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
            "$BT/zipalign" -p -f 4 "$UNSIGNED" out/app-release-unsigned-aligned.apk
            cp android/app/build/outputs/bundle/release/*.aab out/app-release-unsigned.aab
            cp "$BT/lib/apksigner.jar" out/apksigner.jar
            "$BT/aapt2" dump badging out/app-release-unsigned-aligned.apk > out/badging.txt
            cp android/app/src/main/AndroidManifest.xml out/AndroidManifest.source.xml
            cp android/app/build.gradle out/app-build.gradle
            sha256sum out/* > out/SHA256SUMS
          } 2>&1 | tee out/build.log
      - name: Publish outputs to branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          echo "run ${{ github.run_id }} status ${{ steps.build.outcome }} commit ${{ github.sha }}" > out/STATUS.txt
          tail -c 200000 out/build.log > out/build-tail.log 2>/dev/null || true
          rm -f out/build.log
          cd out
          git init -q -b namaste-twa-output
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Build output for ${{ github.sha }} (${{ steps.build.outcome }})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" namaste-twa-output
